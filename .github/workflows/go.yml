name: Build and Release Linux Binary

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download dependencies
        run: go mod tidy

      - name: Build for Linux (amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X 'RealityChecker/internal/version.Version=v3.0'" -o RealityChecker-linux-amd64 .

      - name: Build for Linux (arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X 'RealityChecker/internal/version.Version=v3.0'" -o RealityChecker-linux-arm64 .

      - name: Package Binaries
        run: |
          # 清理可能存在的旧压缩包
          rm -f *.zip
          
          # 处理 amd64 架构
          mkdir -p tmp_amd64
          cp RealityChecker-linux-amd64 tmp_amd64/RealityChecker
          cd tmp_amd64
          # 注意看这里：压缩包的输出名是 ../RealityChecker-linux-amd64.zip
          zip -r ../RealityChecker-linux-amd64.zip RealityChecker
          cd ..
          
          # 处理 arm64 架构
          mkdir -p tmp_arm64
          cp RealityChecker-linux-arm64 tmp_arm64/RealityChecker
          cd tmp_arm64
          # 注意看这里：压缩包的输出名是 ../RealityChecker-linux-arm64.zip
          zip -r ../RealityChecker-linux-arm64.zip RealityChecker
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealityChecker-Linux-Builds
          path: |
            RealityChecker-linux-amd64.zip
            RealityChecker-linux-arm64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            RealityChecker-linux-amd64.zip
            RealityChecker-linux-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
